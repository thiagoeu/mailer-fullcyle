services:
  # Banco de dados relacional para persistência de jobs, logs e status
  postgres:
    image: postgres:16-alpine
    container_name: mailer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mailer_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailer_password}
      POSTGRES_DB: ${DB_NAME:-mailer_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mailer_user} -d ${DB_NAME:-mailer_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker em memória para as filas assíncronas do BullMQ
  redis:
    image: redis:7-alpine
    container_name: mailer-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor SMTP local para testes sem gastar limite do Gmail
  # Interface Web acessível em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailer-mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500

  # Servidor de Métricas e Série Temporal
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mailer-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Plataforma de Dashboards & Visualização de Métricas
  grafana:
    image: grafana/grafana:10.4.0
    container_name: mailer-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  grafanadata:
    driver: local
