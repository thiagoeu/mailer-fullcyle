apiVersion: 1

datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    uid: Postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: mailer_user
    secureJsonData:
      password: mailer_password
    jsonData:
      database: mailer_db
      sslmode: disable
      postgresVersion: 1600
    isDefault: false
    editable: false
